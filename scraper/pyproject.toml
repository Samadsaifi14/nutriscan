[project]
name = "nutriscan-scraper"
version = "0.1.0"
description = "Scrapling-powered scraper service for NutriScan"
requires-python = ">=3.10"
dependencies = [
    "scrapling[all]>=0.4.15",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
]

[project.scripts]
crawl-bigbasket = "scripts.crawl_bigbasket:main"
crawl-blinkit = "scripts.crawl_blinkit:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
