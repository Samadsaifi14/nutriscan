version: "3.8"

services:
  scraper:
    build:
      context: ./scraper
      dockerfile: Dockerfile
    ports:
      - "8100:8100"
    environment:
      - SCRAPER_HOST=0.0.0.0
      - SCRAPER_PORT=8100
      - SCRAPER_WORKERS=2
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8100/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

