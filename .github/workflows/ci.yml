name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - run: npm run lint

      - name: TypeScript type check
        run: npx tsc --noEmit

      - run: npm run test:run

      - name: Production build
        run: npm run build
        env:
          NEXTAUTH_SECRET: ci-build-secret-min-32-chars-long
          NEXTAUTH_URL: http://localhost:3000
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
          SUPABASE_SERVICE_ROLE_KEY: placeholder
          GOOGLE_CLIENT_ID: placeholder
          GOOGLE_CLIENT_SECRET: placeholder

      - name: Install mobile browser test runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: Mobile browser smoke tests and Lighthouse gates
        run: |
          npm run start -- --hostname 127.0.0.1 > /tmp/nutriscan-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl --silent --fail http://127.0.0.1:3000/ > /dev/null; then break; fi
            sleep 2
          done
          curl --fail http://127.0.0.1:3000/ > /dev/null
          node scripts/mobile-smoke.mjs
          npx --yes @lhci/cli@0.15.1 autorun --config=./lighthouserc.json
        env:
          NEXTAUTH_SECRET: ci-build-secret-min-32-chars-long
          NEXTAUTH_URL: http://localhost:3000
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
          SUPABASE_SERVICE_ROLE_KEY: placeholder
          GOOGLE_CLIENT_ID: placeholder
          GOOGLE_CLIENT_SECRET: placeholder

      - run: npm audit --audit-level=high
        continue-on-error: true
